# Guardians of the Ocean — static web app + PWA
# Separate from weott-proposal-engine. Static hosting only.
services:
  - type: web
    name: guardians-of-the-ocean
    runtime: static
    repo: https://github.com/IanDev-cmd/Guardians-of-the-Ocean
    branch: main
    buildCommand: "true"
    staticPublishPath: .
    routes:
      - type: redirect
        source: /i
        destination: /install.html
      - type: redirect
        source: /i/
        destination: /install.html
      - type: redirect
        source: /go
        destination: /install.html
      - type: redirect
        source: /go/
        destination: /install.html
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), usb=(), midi=(), display-capture=()
