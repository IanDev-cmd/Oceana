<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout canceled · Guardians of the Ocean</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#12181f; --muted:#6b7268; --ok:#16a34a; --bg:#f4f6f3; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: var(--bg); color: var(--ink);
    }
    .card {
      width: min(92vw, 480px); background: #fff; padding: 36px 32px 28px;
      border: 1px solid #e4e8e2;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 22px; color: var(--muted); line-height: 1.5; }
    a.btn {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 48px; padding: 0 18px; background: var(--ok); color: #fff;
      text-decoration: none; font-weight: 700; border-radius: 10px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Checkout canceled</h1>
    <p>Your card was not charged. The restoration credit stayed in the cart, and you can pick up where you left off any time.</p>
    <a class="btn" href="desktop.html">Return to Wallet Overview</a>
  </main>
</body>
</html>
